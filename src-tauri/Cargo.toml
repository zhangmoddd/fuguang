[package]
name = "fuguang"
version = "0.1.0"
description = "浮光 - 轻量 Windows 桌面悬浮工具箱"
authors = ["fuguang contributors"]
edition = "2021"
# 依赖树实际要求的下限：tauri 2.11.6 / tauri-build / tauri-utils / tauri-macros /
# tauri-codegen 的 rust-version 都是 1.77.2。写 1.77 会让按文档装 1.77.0 的人
# 编译失败，且报错指向依赖而不是本项目。
rust-version = "1.77.2"

[lib]
# Tauri 2 要求移动端使用 cdylib/staticlib；桌面端用 rlib 让 main.rs 调用。
name = "fuguang_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    # 剪贴板读写（CF_UNICODETEXT）
    "Win32_System_DataExchange",
    # 全局内存分配（剪贴板需要 HGLOBAL）
    "Win32_System_Memory",
    # 线程 ID 查询与 AttachThreadInput（把焦点还给目标窗口的关键）
    "Win32_System_Threading",
    # 开机自启：读写 HKCU 的 Run 键
    # RegCreateKeyExW 的签名里用到 SECURITY_ATTRIBUTES，所以还需要 Win32_Security
    "Win32_System_Registry",
    "Win32_Security",
    # 基础窗口/线程 API
    "Win32_Foundation",
    # 模拟 Ctrl+V
    "Win32_UI_Input_KeyboardAndMouse",
    # 取前台窗口、设置前台窗口、取窗口标题、GetIconInfo/DestroyIcon
    "Win32_UI_WindowsAndMessaging",
    # 打开文件夹、SHGetFileInfoW（提取快捷链接的图标）、ShellExecuteExW
    "Win32_UI_Shell",
    # SHGetFileInfoW 签名里用到 FILE_FLAGS_AND_ATTRIBUTES，
    # 以及 GetLogicalDrives / GetDriveTypeW（核对链接目标还在不在）
    "Win32_Storage_FileSystem",
    # MultiByteToWideChar：解析 .lnk 里的 LocalBasePath。
    # 那一段是**系统 ANSI 代码页**的字节（本机 936），不是 UTF-8，
    # 只有这个 API 能问对"这台机器用哪个代码页"
    "Win32_Globalization",
    # 图标位图转 RGBA 需要 GDI
    "Win32_Graphics_Gdi",
    # 图片编解码（剪贴板 DIB ⇄ PNG）用系统自带的 GDI+：
    # gdiplus.dll 从 XP 起就在系统里，不进安装包，比引 image crate 划算得多
    # （体积取舍见 media.rs / linkicon.rs 的说明）
    "Win32_Graphics_GdiPlus",
] }

# 发布构建体积优化：用户下载的就是这个 exe，尽量压小。
# 开发构建不受影响，仍然保持增量编译速度。
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
